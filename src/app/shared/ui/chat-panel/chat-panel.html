<section
  class="flex-1 flex flex-col min-h-[400px] rounded-xl border border-secondary-container shadow-2xl relative overflow-hidden bg-background"
>
  <div
    class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-gold to-transparent opacity-50 z-10"
  ></div>

  <!-- Header -->
  <div
    class="p-4 border-b border-secondary-container bg-surface-container-high flex justify-between items-center z-10 relative"
  >
    <div>
      <h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-2">
        <app-icon name="forum" class="text-primary" />
        {{ title() }}
      </h2>
      @if (matchLabel()) {
        <p class="font-body-sm text-body-sm text-on-surface-variant mt-1 font-mono">
          {{ matchLabel() }}
        </p>
      }
    </div>
    <button
      type="button"
      class="p-2 text-on-surface-variant hover:text-primary transition-colors bg-surface rounded-md border border-outline-variant hover:border-primary"
      title="View Match Details"
    >
      <app-icon name="info" />
    </button>
  </div>

  <!-- Messages -->
  <div class="flex-1 overflow-y-auto p-6 space-y-6 bg-background/50 relative z-0 scrollbar-elite">
    <div class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-5">
      <app-icon name="account_balance" size="watermark" />
    </div>
    @for (message of messages(); track message.id) {
      <app-chat-message
        [tone]="message.tone"
        [align]="message.align"
        [author]="message.author ?? ''"
        [time]="message.time ?? ''"
        [text]="message.text"
        [avatarInitial]="message.avatarInitial ?? ''"
        [verified]="message.verified ?? false"
      />
    }
  </div>

  <!-- Composer -->
  <div class="p-4 bg-surface-container border-t border-secondary-container relative z-10">
    <div
      class="flex items-end gap-2 bg-background p-2 rounded-lg border border-outline-variant focus-within:border-accent focus-within:ring-1 focus-within:ring-accent transition-all"
    >
      <button
        type="button"
        class="p-2 text-on-surface-variant hover:text-primary transition-colors shrink-0"
        title="Attach evidence"
      >
        <app-icon name="attach_file" />
      </button>
      <app-textarea
        variant="chat"
        [rows]="2"
        [disabled]="sending()"
        [placeholder]="composerPlaceholder()"
        [value]="draft()"
        (valueChange)="draft.set($event)"
      />
      <button
        type="button"
        (click)="submit()"
        [disabled]="sending()"
        class="p-2 rounded-md transition-opacity shrink-0 disabled:opacity-50 disabled:cursor-not-allowed"
        [class]="sendClass()"
      >
        <app-icon name="send" />
      </button>
    </div>
    <div class="mt-2 flex justify-between items-center px-1">
      <span class="text-[10px] text-on-surface-variant flex items-center gap-1">
        @if (showAiHint()) {
          <app-icon name="memory" size="sm" class="text-accent" />
          AI rules assistant active
        }
      </span>
      <span class="text-[10px] text-on-surface-variant">Press Enter to send</span>
    </div>
  </div>
</section>
