<div
  class="font-body-md text-body-md min-h-screen flex flex-col md:flex-row bg-background"
  style="
    background: linear-gradient(
      135deg,
      var(--color-background) 0%,
      var(--color-primary-container) 100%
    );
  "
>
  <app-side-nav brand="Knowledge Coliseum Admin" tone="brand">
    <app-side-nav-header side-nav-header />

    <div side-nav-body class="flex flex-col gap-2">
      <app-nav-item icon="event" label="Events" (clicked)="goToEvents()" />
      <app-nav-item icon="person_add" label="Users" [active]="true" />
    </div>

    <div side-nav-footer class="px-2">
      <app-side-nav-common />
    </div>
  </app-side-nav>

  <div class="md:ml-64 flex flex-col flex-1 w-full">
    <app-top-bar title="Users" />

    <main class="flex-1 p-gutter overflow-y-auto pb-32 flex justify-center">
      <div class="w-full max-w-lg">
        <div class="mb-stack-lg">
          <h2 class="font-display-lg text-display-lg text-on-surface mb-2">Create account</h2>
          <p class="text-on-surface-variant font-body-md text-body-md">
            Add a new player or referee to the platform.
          </p>
        </div>

        <div
          class="bg-surface-container-high/40 border border-outline/20 rounded-xl p-6 flex flex-col gap-stack-lg"
        >
          <div class="flex flex-col gap-3">
            <div
              class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-1"
            >
              <app-icon name="badge" size="sm" /> Role
            </div>
            <div class="grid grid-cols-2 gap-2">
              @for (option of roleOptions; track option.value) {
                <button
                  type="button"
                  (click)="role.set(option.value)"
                  class="flex items-center justify-center gap-2 border py-3 rounded font-title-sm text-title-sm font-bold transition-colors"
                  [class]="
                    role() === option.value
                      ? 'bg-surface-container border-accent text-accent shadow-[0_0_10px_rgba(100,255,218,0.3)]'
                      : 'bg-surface-container border-outline-variant text-on-surface-variant hover:border-accent hover:text-accent'
                  "
                >
                  <app-icon [name]="option.icon" size="sm" />
                  {{ option.label }}
                </button>
              }
            </div>
          </div>

          <div class="flex flex-col gap-2">
            <label
              for="user-name"
              class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-1"
            >
              <app-icon name="badge" size="sm" /> Full name
            </label>
            <app-text-field
              fieldId="user-name"
              tone="light"
              placeholder="E.g. Ada Lovelace"
              [value]="name()"
              (valueChange)="name.set($event)"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label
              for="user-email"
              class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-1"
            >
              <app-icon name="mail" size="sm" /> Email
            </label>
            <app-text-field
              fieldId="user-email"
              tone="light"
              type="email"
              placeholder="ada@example.com"
              [value]="email()"
              (valueChange)="email.set($event)"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label
              for="user-password"
              class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-1"
            >
              <app-icon name="lock" size="sm" /> Password (min. 8 characters)
            </label>
            <app-text-field
              fieldId="user-password"
              tone="light"
              type="password"
              placeholder="supersecret123"
              [value]="password()"
              (valueChange)="password.set($event)"
            />
          </div>

          <app-button
            variant="accent"
            [fullWidth]="true"
            [disabled]="!canCreate()"
            (click)="createUser()"
          >
            <app-icon name="person_add" size="sm" />
            {{ creating() ? 'Creating…' : 'Create account' }}
          </app-button>
        </div>
      </div>
    </main>
  </div>
</div>
