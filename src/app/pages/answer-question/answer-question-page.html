<div class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
  <header class="border-b border-outline-variant bg-surface-container-low w-full">
    <div class="flex justify-between items-center w-full px-margin-desktop h-20 max-w-container-max mx-auto">
      <div class="flex items-center gap-4">
        <img [src]="logoUrl" alt="Liga del Saber" class="h-10 w-10 object-contain" />
        <span class="font-display text-headline-md font-bold text-primary hidden md:block">Liga del Saber</span>
      </div>
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-2">
          <app-icon name="military_tech" class="text-tertiary" />
          <span class="font-label-caps text-label-caps text-tertiary uppercase tracking-wider">Grandmaster</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="font-title-sm text-title-sm text-on-surface hidden md:block">Alejandro Silva</span>
          <app-avatar initials="AS" ring="primary" />
        </div>
      </div>
    </div>
  </header>

  <main class="flex-grow flex flex-col items-center justify-start pt-12 pb-24 px-margin-mobile md:px-0">
    <div class="w-full max-w-[800px] flex flex-col items-center">
      <div class="flex flex-col items-center mb-stack-lg w-full">
        <span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest mb-stack-sm">
          Pregunta {{ questionNumber }} de {{ questionCount }}
        </span>
        <div class="mt-4">
          <app-countdown-timer label="01:45" />
        </div>
      </div>

      <div class="w-full bg-surface-container-low border border-secondary/20 rounded-xl p-8 md:p-12 flex flex-col shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary"></div>

        <div class="self-start mb-6">
          <app-badge variant="primary" icon="science">Física Cuántica</app-badge>
        </div>

        <h1 class="font-headline-md text-headline-md text-on-surface mb-8 leading-relaxed">{{ question }}</h1>

        <div class="flex flex-col gap-4 mt-4 w-full">
          <label class="sr-only" for="answer-input">Tu respuesta</label>
          <app-textarea
            id="answer-input"
            [rows]="6"
            placeholder="Escribe tu respuesta detallada aquí..."
            [value]="answer()"
            (valueChange)="answer.set($event)"
          />
        </div>

        <div class="mt-8 flex justify-end w-full">
          <app-button variant="primary" size="lg" [disabled]="!canSubmit()">
            Enviar respuesta
            <app-icon name="send" />
          </app-button>
        </div>
      </div>

      <div class="mt-16 opacity-10 flex items-center justify-center">
        <app-icon name="school" size="decorative" class="text-primary" />
      </div>
    </div>
  </main>
</div>
