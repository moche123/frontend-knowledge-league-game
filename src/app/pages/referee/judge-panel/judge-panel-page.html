<div
  class="bg-background text-on-background min-h-screen flex flex-col md:flex-row antialiased font-body-md"
>
  <app-side-nav brand="KC Admin" tone="brand">
    <app-side-nav-header side-nav-header />

    <div side-nav-body class="flex flex-col gap-1">
      <app-nav-item icon="assignment" label="Assignments" [active]="true" />
    </div>

    <div side-nav-footer class="px-2">
      <app-side-nav-common />
    </div>
  </app-side-nav>

  <main class="flex-1 md:ml-64 h-screen flex flex-col overflow-hidden bg-background">
    <div
      class="flex-1 flex flex-col lg:flex-row overflow-hidden p-gutter gap-gutter max-w-container-max mx-auto w-full"
    >
      <section
        class="w-full lg:w-1/3 xl:w-2/5 flex flex-col h-full bg-surface-container rounded-lg border border-secondary-container overflow-hidden"
      >
        <div
          class="p-4 border-b border-outline-variant bg-surface-container-high flex justify-between items-center"
        >
          <div>
            <h2 class="font-headline-md text-headline-md text-on-surface">Assigned Matches</h2>
            <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">
              Active tournaments under supervision
            </p>
          </div>
          <button type="button" class="text-tertiary hover:text-tertiary-fixed transition-colors">
            <app-icon name="filter_list" />
          </button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-elite">
          @for (assignment of assignments; track assignment.id) {
            <app-assignment-card
              [status]="assignment.status"
              [tournament]="assignment.tournament"
              [matchup]="assignment.matchup"
              [stage]="assignment.stage"
              [metaLabel]="assignment.metaLabel"
              [time]="assignment.time"
            />
          }
        </div>
      </section>

      <div class="hidden lg:flex w-full lg:w-2/3 xl:w-3/5">
        <app-chat-panel
          matchLabel="Match #TRN-2023-102"
          sendTone="gold"
          [showAiHint]="true"
          [messages]="messages()"
          (send)="onSend($event)"
        />
      </div>
    </div>
  </main>
</div>
