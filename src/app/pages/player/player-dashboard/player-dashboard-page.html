<div class="bg-background text-on-background font-body-md min-h-screen flex flex-col md:flex-row">
  <app-side-nav brand="Knowledge League" tone="surface">
    <app-side-nav-header side-nav-header />

    <div side-nav-body class="flex flex-col gap-1 font-label-caps text-label-caps">
      <app-nav-item icon="emoji_events" label="My Tournaments" [active]="true" />
    </div>

    <div side-nav-footer class="px-2 flex flex-col gap-4">
      <app-button variant="outline" [fullWidth]="true">Start Quiz</app-button>
      <app-side-nav-common />
    </div>
  </app-side-nav>

  <div class="flex-1 flex flex-col min-w-0 md:ml-64">
    <app-top-bar title="Dashboard" />

    <main
      class="flex-1 p-margin-mobile md:p-margin-desktop max-w-container-max mx-auto w-full overflow-y-auto"
    >
      <div class="mb-stack-lg">
        <h3 class="font-display-lg-mobile md:font-display-lg text-primary mb-6">My Tournaments</h3>
        <app-tabs
          variant="underline"
          [tabs]="tabs"
          [active]="activeTab()"
          (activeChange)="activeTab.set($event)"
        />
      </div>

      <div class="mt-8">
        <h4
          class="font-headline-md text-headline-md text-on-surface mb-stack-md flex items-center gap-2"
        >
          <app-icon name="bolt" class="text-tertiary-fixed" />
          Active Events
        </h4>
        <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-gutter">
          @for (tournament of activeEvents(); track tournament.id) {
            <app-tournament-card
              [category]="tournament.category"
              [categoryTone]="tournament.categoryTone"
              [glowClass]="tournament.glowClass"
              [title]="tournament.title"
              [points]="tournament.points"
              [date]="tournament.date"
              [enrolled]="tournament.enrolled"
              [capacity]="tournament.capacity"
              [progress]="tournament.progress"
              [state]="tournament.state"
              [registering]="registeringEventId() === tournament.id"
              (register)="register(tournament.id)"
            />
          } @empty {
            <p class="text-on-surface-variant font-body-md text-body-md col-span-full">
              No events here yet.
            </p>
          }
        </div>
      </div>
    </main>
  </div>
</div>
