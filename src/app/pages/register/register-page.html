<div
  class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden"
>
  <div
    class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--color-primary-container),_var(--color-background)_70%)] opacity-80 z-0"
  ></div>

  <main
    class="w-full max-w-md bg-inverse-surface rounded-xl shadow-2xl relative z-10 flex flex-col p-8 overflow-hidden"
  >
    <div class="flex flex-col items-center mb-8">
      <img
        class="w-28 h-28 object-contain mb-4 filter drop-shadow-md"
        [src]="logoUrl"
        alt="Knowledge League"
      />
      <h1
        class="font-display-lg-mobile text-display-lg-mobile text-on-primary-fixed text-center tracking-tighter"
      >
        KNOWLEDGE LEAGUE <br />
        REGISTER
      </h1>
      <p
        class="font-label-caps text-label-caps text-on-primary-fixed-variant mt-2 tracking-widest uppercase"
      >
        Tournament of Knowledge
      </p>
    </div>

    <form class="w-full flex flex-col gap-stack-md" (ngSubmit)="submit()">
      <app-text-field
        icon="person"
        placeholder="Full name"
        [required]="true"
        [value]="fullName()"
        (valueChange)="fullName.set($event)"
      />
      <app-text-field
        icon="mail"
        type="email"
        placeholder="Email"
        [required]="true"
        [value]="email()"
        (valueChange)="email.set($event)"
      />
      <app-text-field
        icon="lock"
        type="password"
        placeholder="Password"
        [required]="true"
        [value]="password()"
        (valueChange)="password.set($event)"
      />
      @if (state$ | async; as state) {
        @if (state.error) {
          <p class="font-body-sm text-body-sm text-error text-center">{{ state.error }}</p>
        }
        <div class="mt-stack-lg">
          <app-button
            variant="secondary"
            type="submit"
            [disabled]="state.loading"
            [fullWidth]="true"
          >
            {{ state.loading ? 'SIGNING UP…' : 'SIGN UP' }}
            <app-icon name="how_to_reg" size="sm" />
          </app-button>
        </div>
      }
    </form>

    <p class="font-body-sm text-body-sm text-on-primary-fixed-variant text-center mt-6">
      Already have an account?
      <a class="text-on-primary-fixed hover:underline" routerLink="/login">Sign in</a>
    </p>
  </main>
</div>
